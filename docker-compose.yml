services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studypilot_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/studypilot.db:/app/studypilot.db
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studypilot_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: always
